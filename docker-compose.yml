# Uso: docker compose up -d   →  abre http://localhost:8000
services:
  clipmagnet:
    build: .
    image: clipmagnet:latest
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=8g
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
