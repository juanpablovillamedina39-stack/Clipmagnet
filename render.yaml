# Despliegue en Render (plan gratuito). Ver README → "Motor en Render".
services:
  - type: web
    name: clipmagnet
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: CM_ALLOWED_ORIGINS
        sync: false            # p. ej. https://TU-USUARIO.github.io
      - key: CM_TRUST_PROXY_HEADERS
        value: "true"
      - key: CM_MAX_HEIGHT
        value: "1080"
      - key: CM_ALLOW_CONVERT
        value: "false"         # la conversión a H.264 no cabe en 512 MB
      - key: CM_MAX_CONCURRENT
        value: "1"
      - key: CM_MAX_FILESIZE_MB
        value: "500"
      - key: CM_MAX_DURATION
        value: "1800"
      - key: CM_RATE_LIMIT
        value: "10"
